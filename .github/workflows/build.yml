name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: nuget/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore HashTrack.sln

      - uses: microsoft/setup-msbuild@v2

      - name: Build solution
        run: msbuild HashTrack.sln /p:Configuration=Release /m /v:m
