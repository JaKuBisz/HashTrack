name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: nuget/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore HashTrack.sln

      - uses: microsoft/setup-msbuild@v2

      # VSTO requires ClickOnce manifest signing; create a throwaway cert on the runner
      - name: Create temporary signing certificate
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=HashTrack CI" `
            -KeyUsage DigitalSignature -CertStoreLocation Cert:\CurrentUser\My `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3")
          echo "THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV

      - name: Build solution
        run: msbuild HashTrack.sln /p:Configuration=Release /p:ManifestCertificateThumbprint=$env:THUMBPRINT /m /v:m
